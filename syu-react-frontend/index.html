<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 팀 로고(조세현, 2026-08-26) 마크. Stitch 기본 파비콘(보라색 번개)을 걷어냈다.
         apple-touch-icon만 흰 배경으로 굽는다 — iOS는 투명 픽셀을 검게 채운다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REACT - 정서기반 자기조절 지원 서비스</title>
    <meta name="description" content="ADHD 경향 대학생의 건강한 정서와 일상을 위한 정서기반 자기조절 클라우드 서비스" />
    <!-- Google Fonts & Material Symbols CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Hanken Grotesk 하나만 받는다 — headline/body/label 세 슬롯이 모두 이 가족이다
         (index.css의 --font-*). Geist·Sora는 소스 참조가 0건이라 제거했다. -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 아이콘만 display=block이다. swap이면 폰트가 오기 전 폴백으로 그려져
         아이콘 자리에 리가처 원문("close", "arrow_back")이 그대로 깜빡인다.
         block은 그 구간을 투명으로 두므로 글자가 새지 않는다. 본문 폰트는
         읽을 수 있는 폴백이 있으니 swap을 유지한다(FOIT 회피). -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
